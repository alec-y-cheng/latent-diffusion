model:
  base_learning_rate: 4.5e-6
  target: ldm.models.autoencoder.AutoencoderKL
  params:
    monitor: "val/rec_loss"
    embed_dim: 64
    lossconfig:
      target: ldm.modules.losses.LPIPSWithDiscriminator
      params:
        disc_start: 50001
        kl_weight: 0.000001
        disc_weight: 0.5

    ddconfig:
      double_z: True
      z_channels: 64
      resolution: 512
      in_channels: 1
      out_ch: 1
      ch: 128
      ch_mult: [ 1, 2, 4, 8, 8, 16, 16 ]  # num_down = len(ch_mult)-1 (6 downsamples, 512 -> 8)
      num_res_blocks: 2
      attn_resolutions: [ ]
      dropout: 0.0

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 3
    wrap: True
    train:
      target: ldm.data.cfd_data.CFDTrain
      params:
        size: 512
        data_path: data/augmented/full_dataset.npz
    validation:
      target: ldm.data.cfd_data.CFDValidation
      params:
        size: 512
        data_path: data/augmented/full_dataset.npz

lightning:
  modelcheckpoint:
    params:
      save_top_k: 3
      monitor: val/rec_loss
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 3000
        max_images: 8
        increase_log_steps: True

  trainer:
    benchmark: True
    accumulate_grad_batches: 2
